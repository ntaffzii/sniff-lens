<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Network Sniffer</title>
<style>
  :root {
    --bg-main: #09090b;
    --bg-card: #18181b;
    --border-color: #27272a;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent-green: #10b981;
    --accent-blue: #3b82f6;
  }

  * { box-sizing: border-box; }
  body {
    width: 270px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    user-select: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-live {
    font-size: 9px;
    font-weight: 700;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 6px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .badge-live:hover {
    filter: brightness(1.2);
  }
  .badge-live.paused {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.3);
  }

  .dot {
    width: 5px;
    height: 5px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 6px #10b981;
  }
  .badge-live.paused .dot {
    background: #ef4444;
    box-shadow: 0 0 6px #ef4444;
  }

  /* Toggle Switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 32px;
    height: 18px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #3f3f46;
    transition: .2s ease;
    border-radius: 18px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 12px;
    width: 12px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    transition: .2s ease;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #10b981; }
  input:checked + .slider:before { transform: translateX(14px); }

  /* Stats Card */
  .stats-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-val {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* Config Summary */
  .config-pill {
    background: #131316;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Buttons */
  .btn-open-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 9px;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .btn-open-panel:hover {
    background: #2563eb;
  }
  .btn-open-panel:active {
    transform: scale(0.98);
  }

  .hint-text {
    font-size: 9.5px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/icon-32.png" width="20" height="20" style="filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.5));" alt="Logo" />
      <span>Network Sniffer</span>
    </div>

    <div class="badge-live" id="popup-live-badge" title="Click to toggle Sniffing"><span class="dot"></span><span id="popup-live-text">ACTIVE</span></div>
  </div>

  <!-- Master Sniffing Engine Switch Card -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid var(--border-color); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="switch-icon" style="font-size: 14px;">⚡</span>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 11px; font-weight: 700; color: #fff;">Network Sniffing</span>
        <span id="switch-subtitle" style="font-size: 9.5px; color: #34d399;">Active (O(1) Live)</span>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="master-sniff-cb" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-card">
    <div class="stat-item">
      <span class="stat-val" id="count-val">0</span>
      <span class="stat-label">Captured</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="status-val">Ready</span>
      <span class="stat-label">Tab Status</span>
    </div>
  </div>

  <div class="config-pill">
    <span>📁 <span id="popup-folder-val" style="color:#38bdf8; font-weight:600;">captured</span></span>
    <span>🏷️ <span id="popup-pattern-val" style="color:#a1a1aa;">{prefix}_{num3}</span></span>
  </div>

  <button id="open-panel-btn" class="btn-open-panel">
    <span>🖼️ Open Side Panel</span>
  </button>

  <div class="hint-text">
    Auto-sniffs media, prevents duplicates, fullscreen preview & sequential naming.
  </div>


  <script src="popup.js"></script>
</body>
</html>
