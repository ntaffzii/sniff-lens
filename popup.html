<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Network Sniffer</title>
<style>
  :root {
    --bg-main: #09090b;
    --bg-card: #18181b;
    --border-color: #27272a;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent-green: #10b981;
    --accent-blue: #3b82f6;
  }

  * { box-sizing: border-box; }
  body {
    width: 270px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    user-select: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge-live {
    font-size: 9px;
    font-weight: 700;
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 6px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .dot {
    width: 5px;
    height: 5px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 6px #10b981;
  }

  /* Stats Card */
  .stats-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-val {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* Config Summary */
  .config-pill {
    background: #131316;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Buttons */
  .btn-open-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 9px;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .btn-open-panel:hover {
    background: #2563eb;
  }
  .btn-open-panel:active {
    transform: scale(0.98);
  }

  .hint-text {
    font-size: 9.5px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/icon-32.png" width="20" height="20" style="filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.5));" alt="Logo" />
      <span>Network Sniffer</span>
    </div>

    <div class="badge-live"><span class="dot"></span>ACTIVE</div>
  </div>

  <div class="stats-card">
    <div class="stat-item">
      <span class="stat-val" id="count-val">0</span>
      <span class="stat-label">Captured</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="status-val">Ready</span>
      <span class="stat-label">Tab Status</span>
    </div>
  </div>

  <div class="config-pill">
    <span>📁 <span id="popup-folder-val" style="color:#38bdf8; font-weight:600;">captured</span></span>
    <span>🏷️ <span id="popup-pattern-val" style="color:#a1a1aa;">{prefix}_{num3}</span></span>
  </div>

  <button id="open-panel-btn" class="btn-open-panel">
    <span>🖼️ Open Side Panel</span>
  </button>

  <div class="hint-text">
    Auto-sniffs media, prevents duplicates, fullscreen preview & sequential naming.
  </div>

  <script src="popup.js"></script>
</body>
</html>
